
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Placement Drive | PlacementPro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            padding: 35px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        h1 {
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .cancel {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Placement Drive</h1>
    <p class="subtitle">
        Update company and placement information.
    </p>

    <form th:action="@{/admin/drives/update/{id}(id=${drive.id})}"
          th:object="${drive}"
          method="post">

        <div class="form-group">
            <label>Company Name</label>
            <input type="text" th:field="*{companyName}" required>
        </div>

        <div class="form-group">
            <label>Job Role</label>
            <input type="text" th:field="*{jobRole}" required>
        </div>

        <div class="form-group">
            <label>Package (LPA)</label>
            <input type="number" step="0.01"
                   th:field="*{packageLpa}" required>
        </div>

        <div class="form-group">
            <label>Minimum CGPA</label>
            <input type="number" step="0.01"
                   th:field="*{minimumCgpa}" required>
        </div>

        <div class="form-group">
            <label>Eligible Branches</label>
            <input type="text" th:field="*{eligibleBranch}" required>
        </div>

        <div class="form-group">
            <label>Application Deadline</label>
            <input type="date"
                   th:field="*{applicationDeadline}" required>
        </div>

        <div class="form-group">
            <label>Job Description</label>
            <textarea th:field="*{jobDescription}" required></textarea>
        </div>

        <div class="buttons">
            <button type="submit">Update Placement Drive</button>

            <a th:href="@{/drives}" class="cancel">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
