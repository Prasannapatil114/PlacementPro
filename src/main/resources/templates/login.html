
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | PlacementPro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { color: #1e40af; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e40af;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>PlacementPro</h1>
    <h2>Student Login</h2>

    <h4 class="error" th:if="${param.error}">
        Invalid email or password!
    </h4>

    <h4 class="success" th:if="${param.logout}">
        You have logged out successfully.
    </h4>

    <form action="/login" method="post">
        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="/register">Register</a></p>
</div>

</body>
</html>
