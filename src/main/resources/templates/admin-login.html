
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - PlacementPro</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f3f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .login-box {
        background: white;
        padding: 35px;
        border-radius: 12px;
        width: 330px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        color: #1e40af;
        text-align: center;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #1e40af;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .error {
        color: red;
        text-align: center;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h1>Admin Login</h1>
  <p style="text-align:center;">PlacementPro Administration</p>

  <p class="error" th:if="${param.error}">
    Invalid username or password!
  </p>

  <form action="/admin/login" method="post">
    <input type="text" name="username"
           placeholder="Admin Username" required>

    <input type="password" name="password"
           placeholder="Admin Password" required>

    <button type="submit">Login</button>
  </form>
</div>

</body>
</html>
